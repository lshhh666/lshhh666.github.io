<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142c47"/>
      <stop offset="0.65" stop-color="#3d7099"/>
      <stop offset="1" stop-color="#7db3e0"/>
    </linearGradient>
    <linearGradient id="beamFanL" gradientUnits="userSpaceOnUse" x1="795" y1="125" x2="360" y2="80">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamFanR" gradientUnits="userSpaceOnUse" x1="815" y1="125" x2="1160" y2="110">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bTower">
      <polygon points="780,150 830,150 845,330 765,330"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="330" fill="url(#sky)"/>

  <!-- stars -->
  <circle cx="150" cy="180" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="320" cy="90" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="520" cy="150" r="1.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="660" cy="60" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="980" cy="70" r="2.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="1100" cy="160" r="1.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="60" cy="260" r="1.5" fill="#ffffff" opacity="0.4"/>

  <!-- fan-shaped light beams -->
  <polygon points="795,125 380,52 380,170" fill="url(#beamFanL)"/>
  <polygon points="815,125 1160,80 1160,150" fill="url(#beamFanR)"/>

  <!-- sea -->
  <rect x="0" y="330" width="1200" height="70" fill="#0e2338"/>
  <rect x="0" y="330" width="1200" height="4" fill="#2d5f8a" opacity="0.6"/>
  <rect x="120" y="352" width="180" height="3" rx="1.5" fill="#3d7099" opacity="0.5"/>
  <rect x="420" y="368" width="220" height="3" rx="1.5" fill="#3d7099" opacity="0.45"/>
  <rect x="900" y="356" width="160" height="3" rx="1.5" fill="#3d7099" opacity="0.5"/>
  <!-- light reflection on sea -->
  <rect x="782" y="334" width="46" height="52" fill="#ffd54a" opacity="0.12"/>
  <rect x="794" y="334" width="22" height="56" fill="#ffd54a" opacity="0.15"/>

  <!-- lighthouse (right of center) -->
  <polygon points="780,150 830,150 845,330 765,330" fill="#f5f9fc"/>
  <g clip-path="url(#bTower)">
    <rect x="755" y="192" width="100" height="18" fill="#142c47" opacity="0.8"/>
    <rect x="755" y="242" width="100" height="18" fill="#142c47" opacity="0.8"/>
    <rect x="755" y="292" width="100" height="18" fill="#142c47" opacity="0.8"/>
  </g>
  <!-- door -->
  <rect x="796" y="306" width="18" height="24" rx="8" fill="#142c47" opacity="0.85"/>
  <!-- gallery deck -->
  <rect x="770" y="140" width="70" height="10" rx="2" fill="#f5f9fc"/>
  <!-- lantern room -->
  <rect x="784" y="110" width="42" height="30" fill="#f5f9fc"/>
  <rect x="792" y="116" width="26" height="18" fill="#ffd54a"/>
  <!-- roof -->
  <polygon points="776,110 834,110 805,78" fill="#f5f9fc"/>
  <circle cx="805" cy="74" r="4" fill="#f5f9fc"/>
  <!-- lamp glow -->
  <circle cx="805" cy="125" r="18" fill="#ffd54a" opacity="0.25"/>

  <!-- title -->
  <text x="60" y="86" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" letter-spacing="6" fill="#ffffff">LIGHTHOUSE</text>
  <text x="62" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="8" fill="#ffffff" opacity="0.85">灯塔</text>
</svg>
