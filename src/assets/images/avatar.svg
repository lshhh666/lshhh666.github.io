<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a5c"/>
      <stop offset="1" stop-color="#2d5f8a"/>
    </linearGradient>
    <linearGradient id="beamL" gradientUnits="userSpaceOnUse" x1="89" y1="56" x2="14" y2="50">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" gradientUnits="userSpaceOnUse" x1="111" y1="56" x2="186" y2="50">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
    <clipPath id="tower">
      <polygon points="90,75 110,75 122,160 78,160"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect x="0" y="0" width="200" height="200" fill="url(#bgGrad)"/>
    <!-- small stars -->
    <circle cx="36" cy="42" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="160" cy="30" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="174" cy="96" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="24" cy="104" r="1.5" fill="#ffffff" opacity="0.5"/>

    <!-- light beams -->
    <polygon points="89,52 14,36 14,72" fill="url(#beamL)"/>
    <polygon points="111,52 186,36 186,72" fill="url(#beamR)"/>

    <!-- ground base -->
    <ellipse cx="100" cy="162" rx="72" ry="16" fill="#122c47" opacity="0.85"/>
    <rect x="0" y="168" width="200" height="32" fill="#0e2338" opacity="0.9"/>

    <!-- lighthouse -->
    <polygon points="90,75 110,75 122,160 78,160" fill="#f5f9fc"/>
    <g clip-path="url(#tower)">
      <rect x="70" y="95" width="60" height="13" fill="#1a3a5c" opacity="0.8"/>
      <rect x="70" y="122" width="60" height="13" fill="#1a3a5c" opacity="0.8"/>
      <rect x="70" y="149" width="60" height="13" fill="#1a3a5c" opacity="0.8"/>
    </g>
    <!-- gallery deck -->
    <rect x="84" y="66" width="32" height="8" rx="2" fill="#f5f9fc"/>
    <!-- lantern room -->
    <rect x="89" y="46" width="22" height="20" fill="#f5f9fc"/>
    <rect x="93" y="50" width="14" height="12" fill="#ffd54a"/>
    <!-- roof -->
    <polygon points="85,46 115,46 100,30" fill="#f5f9fc"/>
    <circle cx="100" cy="28" r="3" fill="#f5f9fc"/>
    <!-- lamp glow -->
    <circle cx="100" cy="56" r="12" fill="#ffd54a" opacity="0.25"/>
  </g>
</svg>
